.logo i{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font:700 14px ui-monospace,Menlo,monospace;font-style:normal}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 6px 24px -14px rgba(37,99,235,.35)}
.btn{border:0;border-radius:10px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn.ghost{background:var(--soft);color:var(--pri)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--line)}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-top:4px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:0}
label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.hero{text-align:center;padding:36px 0 20px}
.hero h1{font-size:clamp(26px,5vw,40px);margin:14px 0 6px;letter-spacing:-.5px}
.hero p{color:var(--mut);max-width:560px;margin:0 auto}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
@media(max-width:640px){.roles{grid-template-columns:1fr}}
.role{cursor:pointer;text-align:left;transition:.15s}
.role:hover{transform:translateY(-3px);border-color:var(--pri2)}
.role .ic{font-size:30px}
.role h3{margin:8px 0 4px}
.role p{margin:0;color:var(--mut);font-size:14px}
.auth{max-width:460px;margin:24px auto}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:6px}
.tabs button{flex:1;border:0;padding:8px;border-radius:9px;background:transparent;color:var(--mut);font:600 13px inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--pri);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600}
.app{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media(max-width:800px){.app{grid-template-columns:1fr}}
.mods{display:flex;flex-direction:column;gap:8px}
@media(max-width:800px){.mods{flex-direction:row;overflow-x:auto}.mods .mod{min-width:210px}}
.mod{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);font-family:inherit}
.mod.on{border-color:var(--pri);background:var(--soft);box-shadow:inset 3px 0 0 var(--pri)}
.mod b{display:block;font-size:14px}
.mod small{color:var(--mut)}
.mod .n{font:700 11px ui-monospace,Menlo,monospace;color:var(--pri2)}
.mh h2{margin:0 0 4px}
.mh p{margin:0;color:var(--mut);font-size:14px}
.chaps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.sub button{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:6px 12px;border-radius:99px;cursor:pointer;font:600 13px inherit;font-family:inherit}
.sub button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.res{margin-top:10px}
.res .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.res h4{margin:6px 0 2px;font-size:16px}
.badge{font:700 11px ui-monospace,Menlo,monospace;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.b-cours{background:var(--soft);color:var(--pri)}
.b-exercice{background:rgba(16,185,129,.14);color:var(--ok)}
.b-controle{background:rgba(217,119,6,.15);color:var(--warn)}
.meta{color:var(--mut);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--pri);font-weight:600;font-size:13px}
.body{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:8px;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:30px}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:20px 0}
a{color:var(--pri)}
.tt{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--pri);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px -6px rgba(37,99,235,.5)}
.nav{display:flex;gap:8px}
.hero2{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:center;padding:18px 0 8px}
@media(max-width:800px){.hero2{grid-template-columns:1fr}}
.hero2 h1{font-size:clamp(28px,4.6vw,44px);line-height:1.12;margin:14px 0 10px;letter-spacing:-.8px}
.hero2 p{color:var(--mut);margin:0 0 20px;max-width:520px}
.gr{background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.ill{width:100%;height:auto}.himg{display:block;filter:drop-shadow(0 18px 34px rgba(14,116,184,.35))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats .card{text-align:center;padding:14px}.stats b{display:block;font:700 26px ui-monospace,Menlo,monospace;color:var(--pri)}.stats span{color:var(--mut);font-size:13px}
.sec{margin:30px 0 12px;font-size:22px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.g4{grid-template-columns:1fr}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.g2{grid-template-columns:1fr}}
.mc .ic{font-size:26px}.mc h4{margin:4px 0}.mc small{color:var(--mut)}.mc .n{color:var(--pri2);font-size:11px;font-weight:700}
.role ol{margin:8px 0 0;padding-left:20px;color:var(--mut);font-size:14px}
.file{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;background:var(--soft);border-radius:10px;padding:10px 12px}
.file .fi{font-size:24px}.file .fn{flex:1;min-width:140px}.file small{display:block;color:var(--mut)}
.pv{width:100%;height:480px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff;object-fit:contain}
.pdfv{max-height:78vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#e5e7eb;padding:6px}
.pdfv canvas{display:block;margin:0 auto 8px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.tth{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--pri);border-radius:10px;padding:6px 10px;font:600 12px inherit;font-family:inherit;cursor:pointer}.tth svg{width:16px;height:16px}
.pbar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;transition:width .3s}
.plabel{font-size:13px;color:var(--mut);margin-top:10px}.plabel b{color:var(--pri)}
.psteps{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.psteps button{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:8px;padding:4px 10px;font:600 12px inherit;font-family:inherit;cursor:pointer}.psteps button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.prog{border-top:1px dashed var(--line);margin-top:12px;padding-top:2px}
.quiz{margin-top:30px}.qh{margin:0 0 10px;font-size:20px}.qh small{color:var(--mut);font-weight:400;font-size:13px}

<body>
<div class="wrap" id="root"><div class="empty">Chargement…</div></div>
<button id="tt" class="tt" onclick="toggleTheme()" aria-label="Basculer clair / sombre" title="Clair / Sombre"></button>
<script src="storage.js"></script>
<script>
const FIXED_ROLE="eleve";
function ctrlSection(m,prof){
 const arr=S.res.filter(r=>r.type==="controle"&&r.mod===m.n&&(prof||r.tronc==="all"||r.tronc===me.tronc)).sort((a,b)=>a.ts-b.ts);
 const item=r=>ui.cedit===r.id?ctrlForm(m,r):resCard(r);
 return `<div class="acc open" id="ctrl_${m.n}" style="margin-top:14px"><div class="acch" style="cursor:default"><span class="sn mono">FIN DE MODULE</span><b>🧾 Contrôles</b><span class="chip">${arr.length} contrôle(s)</span></div><div class="accb">
 ${prof?`<div class="acts2"><button class="btn sm" onclick="openCtrl()">＋ Ajouter un contrôle (.html)</button></div>${ui.cadd?ctrlForm(m):""}`:`<div class="plabel">Passez les contrôles de ce module après avoir terminé les séquences, le cours, les exercices et les quiz.</div>`}
 ${arr.map(item).join("")}
 ${arr.length||ui.cadd?"":`<div class="empty">${prof?"Aucun contrôle dans ce module. Ajoutez un fichier HTML avec le bouton ci-dessus.":"Votre professeur n’a pas encore publié de contrôle pour ce module."}</div>`}</div></div>`}
function ctrlForm(m,r){
 const e=!!r,val=x=>esc(e?(r[x]||""):""),sel=c=>c?"selected":"";
 return `<div class="card fm"><h3>${e?"✏️ Modifier le contrôle":"＋ Nouveau contrôle"} — Module ${m.n}</h3>
 <label>Titre<input id="c_title" maxlength="120" value="${val("title")}"></label>
 <label>Public visé<select id="c_tr"><option value="all">Tous les troncs communs</option>${Object.entries(TRONC).map(([a,b])=>`<option value="${a}" ${sel(e&&r.tronc===a)}>${b}</option>`).join("")}</select></label>
 <label>Consignes (durée, matériel autorisé…)<textarea id="c_body" rows="3">${val("body")}</textarea></label>
 <div class="plabel" style="margin-top:12px">Fichier du contrôle — HTML uniquement (max 4 Mo)${e?" · laissez vide pour conserver le fichier actuel":""}</div>
 ${e&&r.file?`<div class="file"><span class="fi">📎</span><div class="fn"><b>${esc(r.file.name)}</b><small>${fsize(r.file.size)} · fichier actuel</small></div></div>`:""}
 <label class="btn ghost fpb">📎 ${e?"Remplacer le fichier":"Choisir le fichier .html"}<input id="c_file" type="file" accept=".html,.htm,text/html" onchange="fpName(this,'c_fn')"></label> <span id="c_fn" class="plabel" style="margin:0"></span>
 <div class="plabel">Le fichier s’ouvre dans un cadre isolé : il doit être autonome (CSS et JavaScript inclus dans le même fichier).</div>
 <div class="err" id="cerr"></div><button class="btn" onclick="addCtrl(${e?`'${r.id}'`:"null"})">${e?"Enregistrer les modifications":"Publier"}</button> <button class="btn ghost" onclick="cancelForm()">Annuler</button></div>`}
function openCtrl(){closeForms();ui.cadd=true;render()}
function editCtrl(id){if(!S.res.find(x=>x.id===id))return;closeForms();ui.cedit=id;render()}
async function addCtrl(eid){
 const o=eid?S.res.find(x=>x.id===eid):null,v=k=>($(k)?.value||"").trim(),er=t=>{$("cerr").textContent=t},title=v("c_title"),fl=$("c_file").files[0];
 if(title.length<3)return er("Ajoutez un titre.");
 if(!fl&&!(o&&o.file))return er("Ajoutez le fichier HTML du contrôle.");
 if(fl&&!/^html?$/.test(fext(fl.name)))return er("Le contrôle doit être un fichier .html");
 if(fl&&fl.size>MAXF)return er("Fichier trop volumineux (max 4 Mo).");
 let fm=o?o.file:null,oldF=null;
 if(fl){er("Envoi du fichier…");try{fm=await putFile(fl)}catch(e){return er("Échec de l’envoi du fichier.")}oldF=o&&o.file}
 const f={chap:"",type:"controle",title,body:v("c_body"),link:"",tronc:$("c_tr").value,file:fm,media:[]};
 await mut(()=>{if(eid){const t=S.res.find(x=>x.id===eid);if(!t)return;Object.assign(t,f,{edited:Date.now()})}
  else S.res.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),mod:ui.mod,by:me.id,byName:me.name,ts:Date.now(),...f})});
 if(oldF)delFile(oldF).catch(()=>{});
 closeForms();render()}
function go(m){ui.role=FIXED_ROLE;ui.mode=m;ui.err="";render()}
const MODS=[
{n:1,t:"Généralités sur les systèmes informatiques",h:8,ic:"🖥️",d:"Prise en main d’un ordinateur, composants d’un système informatique et notions de base.",c:["Définitions et vocabulaire de base","Structure de base d’un ordinateur","Types de logiciels","Domaines d’application"]},
{n:2,t:"Les logiciels",h:22,ic:"🧩",d:"Système d’exploitation, traitement de texte et tableur à partir de situations réelles.",c:["Système d’exploitation","Traitement de texte","Tableur"]},
{n:3,t:"Algorithmique et programmation",h:16,ic:"⚙️",d:"Démarche algorithmique, instructions de base, structures séquentielle et sélective, transcription en langage.",c:["Notion d’algorithme","Instructions de base","Structures de contrôle de base","Langages de programmation"]},
{n:4,t:"Réseaux et Internet",h:14,ic:"🌐",d:"Notion et typologie de réseaux, services d’Internet (Web, e-mail, chat pédagogique) et éthique.",c:["Notion de réseau informatique","Réseau Internet"]}];
const TRONC={S:"Sciences",T:"Technologies",L:"Lettres et Arts",O:"Originelles"};
const TYPES={cours:"Cours",exercice:"Exercice",media:"Image / Vidéo",controle:"Contrôle"};
let S={users:[],res:[]},me=null,ref=null,shared=false;
let ui={role:null,mode:"login",mod:1,type:"all",add:null,edit:null,qadd:null,qedit:null,so:{},dash:false,menu:false,err:""};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function hash(p,s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+":"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function load(){
 try{if(ref){const s=await ref.get();S=s.exists?JSON.parse(s.data().json):{users:[],res:[]};return}}catch(e){if(ref){toast("Connexion au serveur impossible.");return}}
 try{S=JSON.parse(localStorage.getItem("il_state")||"")||{users:[],res:[]}}catch(e){S={users:[],res:[]}}
}
async function save(){
 if(ref){try{await ref.set({json:JSON.stringify(S)});return}catch(e){if(e&&e.conflict)throw e;toast("Enregistrement impossible : serveur injoignable.");throw e}}
 try{localStorage.setItem("il_state",JSON.stringify(S))}catch(e){}
}
async function mut(fn){for(let i=0;i<8;i++){await load();const r=fn();try{await save();return r}catch(e){if(!(e&&e.conflict))throw e}}throw new Error("conflit")}
async function init(){
 try{const db=await Promise.race([window.claude&&window.claude.use?window.claude.use("db"):null,new Promise(r=>setTimeout(()=>r(null),4000))]);if(db){DB=db;ref=db.doc("platform/state");shared=true}}catch(e){}
 await load();
 try{const s=(localStorage.getItem("il_me")||"").split("|");if(s[1]){me=S.users.find(u=>u.id===s[0]&&u.role===s[1])||null}}catch(e){}
 if(me&&me.role!==FIXED_ROLE)me=null;if(me){ui.role=me.role;ui.dash=true}
 render();
}
function setRole(r){ui.role=FIXED_ROLE;ui.mode="login";ui.err="";render()}
function setMode(m){ui.mode=m;ui.err="";render()}
function back(){ui.role=null;ui.err="";render()}
async function submitAuth(){
 const t=ui.role==="prof",v=k=>($(k)?.value||"").trim();
 const id=t?v("f_id").toLowerCase():v("f_id").toUpperCase(),pw=$("f_pw").value;
 const fail=m=>{ui.err=m;$("err").textContent=m};
 if(t&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(id))return fail("Adresse e-mail invalide.");
 if(!t&&!/^[A-Z]\d{9}$/.test(id))return fail("Code Massar invalide (ex. : R123456789).");
 if(pw.length<6)return fail("Le mot de passe doit contenir au moins 6 caractères.");
 const h=await hash(pw,id);
 await load();
 const ex=S.users.find(u=>u.id===id&&u.role===ui.role);
 if(ui.mode==="login"){
  if(!ex||ex.h!==h)return fail(t?"E-mail ou mot de passe incorrect.":"Code Massar ou mot de passe incorrect.");
  me=ex;
 }else{
  const nom=v("f_nom"),pre=v("f_pre");if(nom.length<2||pre.length<2)return fail("Indiquez votre nom et votre prénom.");const name=nom.toUpperCase()+" "+pre;
  if(pw!==$("f_pw2").value)return fail("Les mots de passe ne correspondent pas.");
  if(ex)return fail("Un compte existe déjà avec cet identifiant.");
  let cls=null;if(!t){const cn=v("f_cls").toUpperCase().replace(/\s+/g,"");if(!(S.classes||[]).length)return fail("Aucune classe n’a encore été créée par l’enseignant.");cls=(S.classes||[]).find(c=>c.name===cn);if(!cls)return fail("Classe introuvable. Saisissez exactement le nom donné par votre enseignant (ex. TSCF4).")}
   const u={id,role:ui.role,name,nom,pre,h,ts:Date.now()};
  if(!t){u.tronc=cls.tronc||$("f_tr").value;u.cls=cls.name}
  window.__tc="";let dupU=false,bad="";try{await mut(()=>{if(S.users.find(x=>x.id===id&&x.role===ui.role)){dupU=true;return}S.users.push(u)})}catch(e){bad=e&&e.forbidden?"Code d’inscription professeur incorrect.":"Erreur serveur, réessayez."}window.__tc="";if(bad)return fail(bad);if(dupU)return fail("Un compte existe déjà avec cet identifiant.");me=u;
 }
 try{localStorage.setItem("il_me",me.id+"|"+me.role)}catch(e){}
 ui.type="all";ui.mod=1;ui.dash=true;ui.so={};render();
}
function logout(){me=null;ui.role=null;try{localStorage.removeItem("il_me")}catch(e){}render()}
function pickType(t){ui.type=t;render()}
async function delRes(id){if(!await ask("Supprimer cette ressource ?"))return;const o=S.res.find(r=>r.id===id);if(o&&o.file)delFile(o.file).catch(()=>{});if(o&&o.media)o.media.forEach(m=>delFile(m).catch(()=>{}));await mut(()=>{S.res=S.res.filter(r=>r.id!==id)});render()}
async function refresh(){await load();render()}
function authView(){
 const t=ui.role==="prof",reg=ui.mode==="register";
 return `<div class="card auth"><button class="btn ghost sm" onclick="back()">← Retour</button>
 <h2 style="margin:12px 0 2px">${t?"👩‍🏫 Espace Professeur":"🎓 Espace Élève"}</h2>
 <div class="tabs"><button class="${!reg?"on":""}" onclick="setMode('login')">Se connecter</button><button class="${reg?"on":""}" onclick="setMode('register')">Créer un compte</button></div>

 <div class="cfm"><select id="c_tr" style="width:auto;margin:0">${Object.entries(TRONC).map(([a,b])=>`<option value="${a}">${b}</option>`).join("")}</select><input id="c_name" placeholder="TSCF1, TSCF2…" autocapitalize="characters" autocomplete="off"><button class="btn" onclick="addClass()">＋ Ajouter</button></div><div class="err">${esc(ui.cerr||"")}</div>
 ${groups.map(grp).join("")}
 ${und.length?`<details class="lv2" ${dopen("t:?")} ${dtog("t:?")}><summary>❔ Type non défini<span class="chip">${und.length} classe(s)</span></summary><div class="in"><div class="plabel">Choisissez le type de chaque classe pour la ranger dans son groupe.</div>${und.map(c=>cls(c,true)).join("")}</div></details>`:""}
 ${none.length?`<details class="lv2" ${dopen("t:-")} ${dtog("t:-")}><summary>👤 Élèves sans classe<span class="chip">${none.length} élève(s)</span></summary><div class="in">${[...none].sort(byN).map(stu).join("")}</div></details>`:""}
 ${cl.length||none.length?"":`<div class="empty">Aucune classe pour l’instant.</div>`}</div></details></div>
 ${ovView()}`}
/* Boîtes de dialogue intégrées (confirm/alert sont bloqués dans un aperçu intégré) */
function ask(msg,ok="Supprimer"){return new Promise(res=>{const d=document.createElement("div");d.className="mdl";d.innerHTML='<div class="box" role="dialog" aria-modal="true"><h3>Confirmation</h3><p></p><div class="bt"><button class="btn ghost" data-v="0">Annuler</button><button class="btn dng" data-v="1"></button></div></div>';d.querySelector("p").textContent=msg;d.querySelector(".dng").textContent=ok;const end=v=>{d.remove();document.removeEventListener("keydown",kd);res(v)},kd=e=>{if(e.key==="Escape")end(false)};document.addEventListener("keydown",kd);d.addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(b)end(b.dataset.v==="1");else if(e.target===d)end(false)});document.body.appendChild(d);d.querySelector(".dng").focus()})}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
{const _r=render;render=function(){_r.apply(this,arguments);setTimeout(loadMedia,0)}}
init();
</script>
</body>
</html>
